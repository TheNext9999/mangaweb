{% extends "reader/base.html" %}
{% block title %}Quên mật khẩu — MangaVerse{% endblock %}
{% block content %}
<section class="container section auth-section">
  <div class="auth-card reveal-up in-view">
    <h1 class="section-title"><i class="fa-solid fa-key"></i> Quên mật khẩu</h1>
    <p class="auth-hint-text">Nhập email của bạn, MangaVerse sẽ gửi hướng dẫn đặt lại mật khẩu.</p>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary auth-submit"><i class="fa-solid fa-paper-plane"></i> Gửi hướng dẫn</button>
    </form>

    <p class="auth-switch"><a href="{% url 'account_login' %}">← Quay lại đăng nhập</a></p>
  </div>
</section>
{% endblock %}
