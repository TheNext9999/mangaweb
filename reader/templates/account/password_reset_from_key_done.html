{% extends "reader/base.html" %}
{% block title %}Đổi mật khẩu thành công — MangaVerse{% endblock %}
{% block content %}
<section class="container section auth-section">
  <div class="auth-card reveal-up in-view" style="text-align:center;">
    <h1 class="section-title"><i class="fa-solid fa-circle-check"></i> Đổi mật khẩu thành công</h1>
    <p class="auth-hint-text" style="margin-bottom:20px;">Mật khẩu của bạn đã được đặt lại. Giờ bạn có thể đăng nhập bằng mật khẩu mới.</p>
    <a href="{% url 'account_login' %}" class="btn btn-primary auth-submit"><i class="fa-solid fa-right-to-bracket"></i> Đăng nhập ngay</a>
  </div>
</section>
{% endblock %}
