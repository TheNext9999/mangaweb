{% extends "reader/base.html" %}
{% block title %}Đổi mật khẩu — MangaVerse{% endblock %}
{% block content %}
<section class="container section auth-section">
  <div class="auth-card reveal-up in-view">
    <h1 class="section-title"><i class="fa-solid fa-lock"></i> Đổi mật khẩu</h1>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-primary auth-submit">Đổi mật khẩu</button>
    </form>

    <p class="auth-switch"><a href="{% url 'reader:profile' %}"><i class="fa-solid fa-arrow-left"></i> Quay lại hồ sơ</a></p>
  </div>
</section>
{% endblock %}
