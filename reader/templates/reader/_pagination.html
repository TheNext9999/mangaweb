{% if total_pages > 1 %}
<nav class="pagination reveal-up in-view" aria-label="Phân trang">
  <a href="?{{ pagination_query_prefix }}page={{ current_page|add:"-1" }}"
     class="page-arrow {% if current_page == 1 %}disabled{% endif %}" aria-label="Trang trước"><i class="fa-solid fa-chevron-left"></i></a>

  {% for p in page_range %}
    {% if p == None %}
      <span class="page-ellipsis">…</span>
    {% else %}
      <a href="?{{ pagination_query_prefix }}page={{ p }}"
         class="page-num {% if p == current_page %}active{% endif %}">{{ p }}</a>
    {% endif %}
  {% endfor %}

  <a href="?{{ pagination_query_prefix }}page={{ current_page|add:"1" }}"
     class="page-arrow {% if current_page == total_pages %}disabled{% endif %}" aria-label="Trang sau"><i class="fa-solid fa-chevron-right"></i></a>
</nav>
{% endif %}
